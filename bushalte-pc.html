<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Bussen → Utrecht CS Jaarbeurszijde</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Press Start 2P', monospace;
    background: #000;
    color: #fff;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
}

#container {
    width: 1200px;
    background: #000;
    border: 4px solid #fff;
    border-radius: 6px;
    padding: 20px;
}

h1 {
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

#clock {
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
}

.departure {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    padding: 6px 10px;
    margin: 2px 0;
    border-bottom: 1px solid #555;
}

.bus-text { flex: 2; }
.status { flex: 1; font-weight: bold; text-align: right; }

.green { color: #0f0; }
.orange { color: #ffb300; }
.red { color: #f00; }

#error { color: #f00; text-align: center; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<div id="container">
    <h1>🚌 Overste den Oudenlaan → Utrecht CS Jaarbeurszijde</h1>
    <div id="clock">--:--:--</div>
    <div id="departures">Bezig met laden…</div>
    <div id="error"></div>
</div>

<script>
const tpc = "50002540";
const refreshInterval = 30 * 1000;
const walkTimeMin = 12;
let departuresData = [];

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString('nl-NL', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

async function fetchDepartures() {
    const list = document.getElementById("departures");
    const err = document.getElementById("error");
    list.textContent = "Vernieuwen…";
    err.textContent = "";

    try {
        const res = await fetch(`https://v0.ovapi.nl/tpc/${tpc}`);
        if (!res.ok) throw new Error(res.statusText);
        const json = await res.json();
        updateDepartures(json[tpc]);
    } catch (e) {
        console.error(e);
        err.textContent = "Kon live-data niet laden 😕";
    }
}

function updateDepartures(stopData) {
    const now = new Date();
    const list = document.getElementById("departures");
    list.innerHTML = "";
    departuresData = [];

    if (!stopData || !stopData.Passes) {
        list.innerHTML = "<p>Geen vertrektijden beschikbaar.</p>";
        return;
    }

    const directionMap = { "4": 1, "5": 2, "7": 2 };

    for (const key in stopData.Passes) {
        const pass = stopData.Passes[key];
        const line = pass.LinePublicNumber;
        if (!directionMap[line]) continue;
        if (pass.LineDirection !== directionMap[line]) continue;

        const depTimeStr = pass.ExpectedDepartureTime || pass.TargetDepartureTime;
        if (!depTimeStr) continue;

        const depTime = new Date(depTimeStr);
        const minutes = Math.round((depTime - now) / 60000);
        if (minutes < -1 || minutes > 90) continue;

        departuresData.push({
            line,
            destination: pass.DestinationName50,
            depTime,
            delay: pass.Delay || 0
        });
    }

    departuresData.sort((a,b) => a.depTime - b.depTime);
    renderDepartures();
}

function renderDepartures() {
    const list = document.getElementById("departures");
    list.innerHTML = "";
    const now = new Date();
    const show = departuresData.slice(0,6);

    if (show.length === 0) {
        list.innerHTML = "<p>Geen bussen van lijnen 4, 5 of 7 richting Utrecht CS Jaarbeurszijde binnen 90 minuten.</p>";
        return;
    }

    for (const d of show) {
        const div = document.createElement("div");
        div.className = "departure";

        const hours = d.depTime.getHours().toString().padStart(2,"0");
        const mins = d.depTime.getMinutes().toString().padStart(2,"0");
        const busText = document.createElement("div");
        busText.className = "bus-text";

        const minutes = Math.round((d.depTime - now) / 60000);
        let txt = `${d.line} → ${d.destination} : ${minutes} min (${hours}:${mins})`;
        if (d.delay > 0) txt += ` (+${d.delay} min vertraging)`;
        busText.textContent = txt;

        const span = document.createElement("div");
        span.className = "status";

        if (minutes > walkTimeMin + 3) {
            span.textContent = `Ga over ${minutes - walkTimeMin} min`;
            span.className = "status green";
        } else if (minutes >= walkTimeMin + 1) {
            span.textContent = "Ga nu lopen";
            span.className = "status green";
        } else if (minutes >= 10) {
            span.textContent = "Haasten!";
            span.className = "status orange";
        } else {
            span.textContent = "Te laat!";
            span.className = "status red";
        }

        div.appendChild(busText);
        div.appendChild(span);
        list.appendChild(div);
    }
}

fetchDepartures();
setInterval(fetchDepartures, refreshInterval);
setInterval(renderDepartures, 1000);
</script>
</body>
</html>
