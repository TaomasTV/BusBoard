<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Bussen → Utrecht CS Jaarbeurszijde</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: 'Press Start 2P', monospace;
    background: #000;
    color: #fff;
    padding: 10px;
}

#container {
    width: 100%;
    max-width: 1179px;
    background: #000;
    border: 4px solid #fff;
    border-radius: 6px;
    padding: 15px;
}

h1 {
    font-size: 16px;
    text-align: center;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

#clock {
    text-align: center;
    font-size: 14px;
    margin-bottom: 15px;
}

.departure {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 5px 10px;
    margin: 2px 0;
    border-bottom: 1px solid #555;
}

.bus-text { flex: 2; }
.status { flex: 1; font-weight: bold; text-align: right; }

.green { color: #0f0; }
.orange { color: #ffb300; }
.red { color: #f00; }

#error { color: #f00; text-align: center; margin-top: 10px; font-size: 12px; }
</style>
</head>
<body>
<div id="container">
    <h1>🚌 Overste den Oudenlaan → Utrecht CS Jaarbeurszijde</h1>
    <div id="clock">--:--:--</div>
    <div id="departures">Bezig met laden…</div>
    <div id="error"></div>
</div>

<script>
// ✅ Shortcut moet hier de JSON invullen:
let departuresData = [ /* JSON data van Shortcut */ ];

const walkTimeMin = 12;

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString('nl-NL', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

function renderDepartures() {
    const list = document.getElementById("departures");
    list.innerHTML = "";
    const now = new Date();

    if (!departuresData || departuresData.length === 0) {
        list.innerHTML = "<p>Geen bussen binnen 90 minuten.</p>";
        return;
    }

    departuresData.sort((a,b) => new Date(a.depTime) - new Date(b.depTime));
    const show = departuresData.slice(0,6);

    for (const d of show) {
        const div = document.createElement("div");
        div.className = "departure";

        const depTime = new Date(d.depTime);
        const minutes = Math.round((depTime - now) / 60000);

        const hours = depTime.getHours().toString().padStart(2,"0");
        const mins = depTime.getMinutes().toString().padStart(2,"0");

        const busText = document.createElement("div");
        busText.className = "bus-text";
        busText.textContent = `${d.line} → ${d.destination} : ${minutes} min (${hours}:${mins})`;

        const span = document.createElement("div");
        span.className = "status";

        if (minutes > walkTimeMin + 3) {
            span.textContent = `Ga over ${minutes - walkTimeMin} min`;
            span.className = "status green";
        } else if (minutes >= walkTimeMin + 1) {
            span.textContent = "Ga nu lopen";
            span.className = "status green";
        } else if (minutes >= 10) {
            span.textContent = "Haasten!";
            span.className = "status orange";
        } else {
            span.textContent = "Te laat!";
            span.className = "status red";
        }

        div.appendChild(busText);
        div.appendChild(span);
        list.appendChild(div);
    }
}

renderDepartures();
setInterval(renderDepartures, 1000);
</script>
</body>
</html>
